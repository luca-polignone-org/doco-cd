name: Build Image

on:
  push:
    tags:
      # Fork: only fork releases (vX.Y.Z-poli.N) build an image; upstream tags fetched by the
      # upstream merge never do.
      - 'v*-poli.*'

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    permissions:
      contents: read # to fetch the repository content
      id-token: write # for signing attestation(s) with GitHub OIDC Token
      packages: write # required to push to GHCR
    with:
      build-args: |
        APP_VERSION=${{ github.ref_name }}
      platforms: linux/amd64,linux/arm64,linux/arm/v7
      #,linux/riscv64
      runner: |
        default=ubuntu-24.04
        linux/arm=ubuntu-24.04-arm
        linux/arm64=ubuntu-24.04-arm
      #linux/riscv64=ubuntu-24.04-riscv
      cache: true
      cache-mode: max
      output: image
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # Fork: provenance is always attested by docker/github-builder and sbom is set above. This job
  # creates the release if missing and adds the multi-platform digest and the number of upstream
  # files the fork touches (spec, "Risks") to its notes.
  release-notes:
    name: Digest in the release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create and edit the release
    needs:
      - build
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Digest in the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Multi-platform index digest pushed by the reusable workflow (its outputs.digest).
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          # Upstream tags reach this repository only through the merge commit, not as tags.
          git fetch --no-tags https://github.com/kimdre/doco-cd.git 'refs/tags/v*:refs/tags/v*'
          upstream_tag=$(git describe --tags --match 'v*' --exclude '*-poli.*' --abbrev=0)
          base=$(git merge-base HEAD "$upstream_tag")
          # Upstream files the fork modified or deleted; files the fork added are not counted.
          touched=$(git diff --no-renames --diff-filter=MD --name-only "$base" HEAD | wc -l)
          if [ -z "$DIGEST" ]; then echo "no image digest from the build job"; exit 1; fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes --verify-tag
          # A re-run must not append the lines a second time.
          if gh release view "$GITHUB_REF_NAME" --json body -q .body | grep -q '^Image: `ghcr.io/'; then echo "release notes already have the image digest"; exit 0; fi
          gh release edit "$GITHUB_REF_NAME" --notes "$(gh release view "$GITHUB_REF_NAME" --json body -q .body)

          Image: \`ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}\` (linux/amd64, linux/arm64, linux/arm/v7)
          Upstream files touched by the fork (since ${upstream_tag}): ${touched}"

  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
       contents: write # write to upload the SBOM file
       packages: read # fork: the GHCR package is private, Trivy must log in to read the image
    needs:
      - build
      - release-notes # the release must exist before the SBOM is uploaded to it
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare
        run: |
          # Get version without 'v' prefix
          echo "APP_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Generate Software Bill of Materials (SBOM)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          # Fork: registry credentials for the private GHCR package (v0.127.0-poli.1 failed with UNAUTHORIZED).
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ env.APP_VERSION }}
          scan-type: image
          format: cyclonedx
          github-pat: ${{ secrets.GITHUB_TOKEN }}
          output: doco-cd_${{ github.ref_name }}_sbom.cdx.json
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln,secret,misconfig,license
          ignore-unfixed: false
          exit-code: 0

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-sbom-report
          path: doco-cd_${{ github.ref_name }}_sbom.cdx.json
          retention-days: 90

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} doco-cd_${{ github.ref_name }}_sbom.cdx.json --clobber
